# yaml-language-server: $schema=https://raw.githubusercontent.com/bilgi-ship-it/kepenk/main/schemas/kepenk-tests-v1.schema.json
version: 1

cases:
  - id: allow-lint
    action:
      type: shell
      command: npm run lint
    expect:
      effect: allow
      rule_id: allow-lint

  - id: allow-typecheck
    action:
      type: shell
      command: npm run typecheck
    expect:
      effect: allow
      rule_id: allow-typecheck

  - id: allow-local-build
    action:
      type: shell
      command: npm run build
    expect:
      effect: allow
      rule_id: allow-local-build

  - id: approve-dependency-install
    action:
      type: shell
      command: npm install example-package
    expect:
      effect: approval
      rule_id: require-dependency-change-approval

  - id: approve-remote-change
    action:
      type: shell
      command: git push origin main
    expect:
      effect: approval
      rule_id: require-remote-git-change-approval

  - id: deny-package-publish
    action:
      type: shell
      command: npm publish
    expect:
      effect: deny
      rule_id: deny-public-package-publish

  - id: unmatched-command-uses-default
    action:
      type: shell
      command: npm run dev:web
    expect:
      effect: approval
      rule_id: null
